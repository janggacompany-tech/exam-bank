<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- PAGE-START -->
<title>레벨 진단 시험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F5F6F2; --surface:#FFFFFF; --surface-2:#ECEEE7; --line:#D8DCD1; --line-strong:#B9BFB2;
  --ink:#1A2130; --ink-2:#48516A; --muted:#7A8394;
  --accent:#2451B3; --accent-ink:#FFFFFF; --accent-soft:#E2E9FA; --accent-line:#9DB3EA;
  --ok:#1E8E5A; --ok-soft:#DDF2E6; --bad:#C43A2E; --bad-soft:#FBE3E0; --warn:#B07417; --warn-soft:#FBEFD6;
  --shadow:0 1px 2px rgba(20,30,50,.05), 0 10px 30px rgba(20,30,50,.06);
  --r:10px; --r-lg:16px;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141C; --surface:#171C27; --surface-2:#1F2532; --line:#2B3342; --line-strong:#3D4658;
    --ink:#E8EBF1; --ink-2:#B6BCC8; --muted:#7E8797;
    --accent:#84A4FF; --accent-ink:#0B1020; --accent-soft:#1E2A4A; --accent-line:#3C5390;
    --ok:#4CCB8C; --ok-soft:#14331F; --bad:#F27A70; --bad-soft:#3B1D19; --warn:#E5AB4C; --warn-soft:#3A2D12;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#171C27; --surface-2:#1F2532; --line:#2B3342; --line-strong:#3D4658;
  --ink:#E8EBF1; --ink-2:#B6BCC8; --muted:#7E8797;
  --accent:#84A4FF; --accent-ink:#0B1020; --accent-soft:#1E2A4A; --accent-line:#3C5390;
  --ok:#4CCB8C; --ok-soft:#14331F; --bad:#F27A70; --bad-soft:#3B1D19; --warn:#E5AB4C; --warn-soft:#3A2D12;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.shell{max-width:760px;margin:0 auto;padding:40px 20px 80px}
.shell.wide{max-width:1100px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:20px;flex:none}
.brand h1{font-size:22px}
.brand p{color:var(--ink-2);font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:24px;background:var(--surface-2)}
.spec > div{padding:12px 16px;background:var(--surface);border-right:1px solid var(--line)}
.spec > div:last-child{border-right:0}
.spec .k{font-size:12px;color:var(--muted);font-weight:500}
.spec .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.spec .v small{font-size:12px;color:var(--ink-2);font-weight:500;margin-left:2px}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.input{width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input.err{border-color:var(--bad)}
textarea.input{min-height:80px;resize:vertical}
.error{font-size:12px;color:var(--bad)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);margin:6px 0 20px}
.check input{margin-top:4px;accent-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%}

.notice{padding:12px 14px;border-radius:var(--r);font-size:13px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);margin-bottom:16px}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.notice.bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.notice.ok{background:var(--ok-soft);border-color:transparent;color:var(--ink)}
.notice b{font-weight:600}
.notice ul{margin:6px 0 0 18px;padding:0}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.lvl{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent)}

/* ===== 시험 ===== */
.exambar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);}
.exambar .in{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.exambar .who{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exambar .who small{color:var(--muted);font-weight:500;margin-left:6px}
.exambar .prog{margin-left:auto;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer{font-family:var(--mono);font-weight:600;font-size:20px;letter-spacing:.02em;padding:4px 10px;border-radius:8px;background:var(--surface-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.warn{background:var(--bad-soft);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.progressbar{height:3px;background:var(--surface-2)}
.progressbar i{display:block;height:100%;background:var(--accent);transition:width .2s}

.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-bottom:22px}
.qnav button{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.qnav button.done{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.qnav button.cur{outline:2px solid var(--ink);outline-offset:-1px;color:var(--ink)}
.qgroup{grid-column:1/-1;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}

.question{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:28px}
.question .head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.question .num{font-family:var(--mono);font-weight:600;color:var(--muted);font-size:13px}
.question h2{font-size:19px;font-weight:600;line-height:1.55;margin-bottom:22px;white-space:pre-wrap}
.choices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line-strong);border-radius:var(--r);cursor:pointer;transition:border-color .12s,background .12s;background:var(--surface)}
.choice:hover{background:var(--surface-2)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice .t{white-space:pre-wrap;padding-top:1px}
.choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.choice.correct .n{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .n{background:var(--bad);border-color:var(--bad);color:#fff}
.choice.static{cursor:default}
.choice.static:hover{background:inherit}
.choice.static.correct:hover{background:var(--ok-soft)}
.choice.static.wrong:hover{background:var(--bad-soft)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.keyhint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:var(--surface)}

/* ===== 결과 ===== */
.score{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin-bottom:22px}
.score .big{font-family:var(--mono);font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:22px;color:var(--muted);font-weight:500}
.score .meta{color:var(--ink-2);font-size:14px;padding-bottom:8px}
.levels{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.lrow{display:grid;grid-template-columns:70px 1fr 64px;gap:12px;align-items:center;font-size:14px}
.lrow .bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.lrow .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.lrow .c{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.review{margin-top:24px}
.review .question{padding:20px 22px;margin-top:12px;box-shadow:none}
.review .question h2{font-size:16px;margin-bottom:14px}
.review .choice{padding:9px 12px}
.explain{margin-top:12px;font-size:13px;color:var(--ink-2);padding:10px 12px;border-left:3px solid var(--line-strong);background:var(--surface-2);border-radius:0 8px 8px 0}

/* ===== 이해도 분석 · 교안 ===== */
.topics{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:64px 1fr 120px 52px 48px;gap:10px;align-items:center;font-size:13px}
.trow .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.trow .bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.trow .bar i.ok{background:var(--ok)}.trow .bar i.warn{background:var(--warn)}.trow .bar i.bad{background:var(--bad)}
.trow .c{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
@media (max-width:560px){.trow{grid-template-columns:56px 1fr 44px 44px}.trow .bar{display:none}}
.review-part{margin-top:16px;border-left:4px solid var(--bad)}
.keypoints{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.7}
.keypoints li.kf{list-style:none;margin-left:-18px;font-family:var(--mono);font-size:13px;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:6px;display:inline-block;margin-top:4px}
.keypoints li.kq{color:var(--ink-2);font-style:italic}
.gdetails{margin-top:12px}
.gdetails summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--accent)}
.gbody{margin-top:10px;padding:14px 16px;background:var(--surface-2);border-radius:var(--r);font-size:14px;line-height:1.7;max-width:65ch}
.gbody h4{margin:14px 0 6px;font-size:14px}.gbody h4.gh3{font-size:13px;color:var(--ink-2)}
.gbody .gp{margin:4px 0}.gbody .glist{margin:4px 0 4px 18px;padding:0}
.gformula{font-family:var(--mono);font-size:13px;background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:6px;margin:6px 0;display:inline-block}
.gquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--line-strong);color:var(--ink-2);font-style:italic}
.witem{padding:12px 0;border-top:1px dashed var(--line);font-size:14px}
.witem .wq{font-weight:600;margin-bottom:6px}
.witem .wa{font-size:13px;margin-top:4px}

/* ===== 계산형 문항 ===== */
.case{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.case .eyebrow{margin-bottom:6px}
.case p{font-size:14px;line-height:1.7;white-space:pre-wrap;color:var(--ink)}
.parts{display:flex;flex-direction:column;gap:10px}
.part{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center}
.part .plabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.part .pinput{font-family:var(--mono);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.part .punit{font-size:14px;color:var(--ink-2);min-width:24px}
.pills{display:flex;gap:8px;grid-column:2/4}
.pill{padding:8px 16px;border:1px solid var(--line-strong);border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.review-parts .pval{font-family:var(--mono);font-weight:600;padding:4px 10px;border-radius:6px;justify-self:start}
.review-parts .pval.ok{background:var(--ok-soft);color:var(--ok)}
.review-parts .pval.bad{background:var(--bad-soft);color:var(--bad)}
.review-parts .pkey{font-size:13px;color:var(--ink-2)}

/* ===== 관리자 ===== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{padding:10px 14px;border:0;background:none;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.stat .v small{font-size:12px;color:var(--muted);font-family:var(--sans);font-weight:500}
.stat.low .v{color:var(--warn)}
.stat.zero .v{color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
.trunc{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editor{border:1px solid var(--accent-line);background:var(--surface);border-radius:var(--r);padding:18px;margin-bottom:14px}
.editor .field{margin-bottom:10px}
.detail{padding:12px 14px;background:var(--surface-2);font-size:13px}
.detail .a{display:grid;grid-template-columns:80px 1fr auto;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.detail .a:last-child{border-bottom:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.mono{white-space:nowrap}
.dz{border:2px dashed var(--line-strong);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-2);font-size:14px;margin-bottom:14px;background:var(--surface)}
.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.dz input{display:none}
.footer{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow);z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch .l{font-size:14px;font-weight:600}
.switch .d{font-size:12px;color:var(--muted)}
.switch input{width:18px;height:18px;accent-color:var(--accent);flex:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>

<script src="questions.js"></script>
<script src="guide.js"></script>
<script src="tools/word-parser.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.12.3/mammoth.browser.min.js"></script>
<script>
(function(){
'use strict';

// ===================== 설정 =====================
const LEVELS = [1,2,3,4,5];
const DEFAULT_CONFIG = {
  title: '레벨 진단 시험',
  intro: '총 5개 레벨의 문제은행에서 레벨별 문항이 무작위로 출제됩니다. 시작하면 타이머가 바로 시작되니 준비되면 시작해 주세요.',
  perLevel: 5,          // 레벨당 출제 문항 수
  timeLimitMin: 30,     // 제한 시간(분). 0이면 제한 없음
  passPercent: 60,      // 합격 기준(%)
  numTolerancePct: 0.2, // 계산형 문항 허용 오차(%) — 정답과 이 비율 이내면 정답 처리
  shuffleChoices: true, // 보기 순서 섞기
  showAnswers: true,    // 제출 후 정답/해설 공개
  adminPass: '1924',
  webhookUrl: 'https://script.google.com/macros/s/AKfycbxSrRiSTCbzbjUiRejhk52Pe8cWpFGhOcttq69IHwhTPfonZfEoTKnx9QwbrSzemGAMGw/exec' // 구글 Apps Script 웹앱 URL (결과 자동 전송)
};

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const sess = {
  get(k, d){ try{ const v = sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },

const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
function shuffle(a){ const r = a.slice(); for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function fmtTime(sec){ sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' : '') + pad(m) + ':' + pad(s); }
function fmtDate(ts){ const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function formatPhone(v){ const d = v.replace(/\D/g, '').slice(0, 11); if (d.length < 4) return d; if (d.length < 8) return d.slice(0,3) + '-' + d.slice(3); if (d.length === 10 && !d.startsWith('010')) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6); return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7); }
let toastId;

function download(name, text, type){

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();

function csvCell(v){ v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

// ===================== 계산형(주관식) 문항 =====================
// 정답 키 예: "16,000,000원" / "A 40,000원 / B 40,000원 / C 60,000원" / "차이 16,200원 / 손익선 안" / "0.19%"
function parseNumber(str){
  const s = String(str == null ? '' : str).trim().replace(/\s+/g, '').replace(/,/g, '');
  if (!s) return null;
  let m;
  if ((m = s.match(/^(-?\d+(?:\.\d+)?)억(?:(\d+(?:\.\d+)?)만)?/))) return parseFloat(m[1]) * 1e8 + (m[2] ? parseFloat(m[2]) * 1e4 : 0);
  if ((m = s.match(/^(-?\d+(?:\.\d+)?)만/))) return parseFloat(m[1]) * 1e4;
  return (m = s.match(/-?\d+(?:\.\d+)?/)) ? parseFloat(m[0]) : null;
}
function unitOf(str){ return String(str == null ? '' : str).replace(/[\d,.\s\-]/g, '').replace(/^(만|억)+/, ''); }
function parseAnswerKey(key){
  return String(key == null ? '' : key).split('/').map(s => s.trim()).filter(Boolean).map(seg => {
    let m;
    if ((m = seg.match(/^손익선\s*(안|밖)$/))) return { kind: 'choice', label: '손익선', options: ['안', '밖'], answer: m[1] };
    const lm = seg.match(/^([A-Za-z가-힣]{1,6})\s+(.+)$/);
    const label = lm ? lm[1] : '', val = lm ? lm[2] : seg;
    const num = parseNumber(val);
    if (num == null) return { kind: 'text', label, answer: val };
    return { kind: 'number', label, answer: val, value: num, unit: unitOf(val) };
  });
}
function partCorrect(p, u){
  u = String(u == null ? '' : u).trim(); if (!u) return false;
  if (p.kind === 'choice') return u === p.answer;
  if (p.kind === 'text') return u.replace(/\s+/g, '') === p.answer.replace(/\s+/g, '');
  const v = parseNumber(u); if (v == null) return false;
  const tol = Math.max(Math.abs(p.value) * (config.numTolerancePct || 0) / 100, p.unit === '%' ? 0.011 : 0.5);
  return Math.abs(v - p.value) <= tol;
}
// ===================== 교안 연동: 이해도 분석 =====================
function getGuide(){ const d = store.get('exam.guideDraft', null); if (d && Array.isArray(d.parts) && d.parts.length) return d; const g = window.STUDY_GUIDE; return (g && Array.isArray(g.parts) && g.parts.length) ? g : null; }
function partsForTopic(guide, topic){
  if (!guide) return [];
  const tm = guide.topicMap || {}; if (tm[topic]) return tm[topic].slice();
  const out = []; (guide.keywordMap || []).forEach(([re, parts]) => { try{ if (new RegExp(re).test(topic || '')) parts.forEach(p => { if (!out.includes(p)) out.push(p); }); }catch(e){} });
  return out;
}
function analyzeResult(s, r){
  const guide = getGuide(); const bank = getBank();
  const byTopic = {};
  s.questions.forEach((q, i) => {
    const src = bank.find(b => b.id === q.id); const topic = q.topic || (src && src.topic) || '기타';
    const k = q.level + '|' + topic; byTopic[k] = byTopic[k] || { topic, level: q.level, total: 0, correct: 0, wrong: [] };
    byTopic[k].total++; if (r.answers[i].correct) byTopic[k].correct++; else byTopic[k].wrong.push(i);
  });
  const topics = Object.values(byTopic).sort((a, b) => (a.correct / a.total) - (b.correct / b.total) || a.level - b.level);
  const byPart = {};
  if (guide) topics.forEach(t => partsForTopic(guide, t.topic).forEach(no => {
    const part = guide.parts.find(p => p.no === no); if (!part) return;
    const e = byPart[no] = byPart[no] || { no, part, total: 0, correct: 0, topics: [], wrong: [] };
    e.total += t.total; e.correct += t.correct; if (!e.topics.includes(t.topic)) e.topics.push(t.topic); e.wrong.push(...t.wrong);
  }));
  const parts = Object.values(byPart).sort((a, b) => (a.correct / a.total) - (b.correct / b.total) || a.no - b.no);
  // 복습 추천: 정답률 70% 미만인 파트, 최대 6개. 나머지 틀린 파트는 "가볍게 확인" 목록으로.
  const weak = parts.filter(p => p.wrong.length && p.correct / p.total < 0.7).slice(0, 6);
  const light = parts.filter(p => p.wrong.length && !weak.includes(p));
  return { topics, parts, weak, light, hasGuide: !!guide };
}
function topicStatus(t){ const p = t.correct / t.total; return p >= 1 ? ['ok', '탄탄'] : p >= 0.6 ? ['warn', '보통'] : ['bad', '부족']; }
function renderBlock(b){
  if (b.kind === 'formula') return `<div class="gformula">${esc(b.text)}</div>`;
  if (b.kind === 'bullet') return `<li>${esc(b.text)}</li>`;
  if (b.kind === 'quote') return `<blockquote class="gquote">${esc(b.text)}</blockquote>`;
  return `<p class="gp">${esc(b.text)}</p>`;
}
function renderBlocks(blocks){
  let html = '', inList = false;
  blocks.forEach(b => { const li = b.kind === 'bullet'; if (li && !inList){ html += '<ul class="glist">'; inList = true; } if (!li && inList){ html += '</ul>'; inList = false; } html += renderBlock(b); });
  if (inList) html += '</ul>';
  return html;
}
function renderPartFull(part){ return part.sections.map(sec => `${sec.title ? `<h4 class="gh${sec.level}">${esc(sec.title)}</h4>` : ''}${renderBlocks(sec.blocks)}`).join(''); }
function renderKeyPoints(part){
  const items = [];
  part.sections.forEach(sec => {
    if (sec.title && sec.level === 2) items.push(`<li><b>${esc(sec.title)}</b></li>`);
    sec.blocks.filter(b => b.kind === 'formula' || b.kind === 'quote').forEach(b => items.push(`<li class="${b.kind === 'formula' ? 'kf' : 'kq'}">${esc(b.text)}</li>`));
  });
  return items.length ? `<ul class="keypoints">${items.join('')}</ul>` : '';
}

function inputCorrect(q, arr){ const parts = parseAnswerKey(q.answer); return parts.length > 0 && parts.every((p, i) => partCorrect(p, Array.isArray(arr) ? arr[i] : null)); }
function isAnswered(a){ return Array.isArray(a) ? a.some(x => x != null && String(x).trim() !== '') : a != null; }
function fmtPicked(q, picked){
  if (q.type === 'input'){ if (!Array.isArray(picked)) return ''; const parts = parseAnswerKey(q.answer); return parts.map((p, i) => (p.label ? p.label + ' ' : '') + (picked[i] || '—')).join(' / '); }
  return picked == null ? '' : (picked + 1) + '번';
}
function toCSV(rows){ return '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'); }

// ===================== 시험 세션 =====================
let session = sess.get('exam.session', null);
let timerId = null;
function saveSession(){ sess.set('exam.session', session); }
function clearSession(){ session = null; sess.del('exam.session'); }

function buildExam(bank){
  const questions = [], shortages = [];
  LEVELS.forEach(L => {
    const all = bank.filter(q => q.level === L);
    let take;
    const groups = [...new Set(all.map(q => q.group).filter(Boolean))];
    if (groups.length && all.every(q => q.group)){
      // 사례(CASE) 단위 문항은 사례를 통째로 뽑아 순서대로 출제
      take = []; for (const g of shuffle(groups)){ if (take.length >= config.perLevel) break; take = take.concat(all.filter(q => q.group === g)); }
      take = take.slice(0, config.perLevel);
    } else take = shuffle(all).slice(0, config.perLevel);
    if (take.length < config.perLevel) shortages.push({ level: L, have: take.length });
    take.forEach(q => {
      if (q.type === 'input'){ questions.push({ id: q.id, level: L, type: 'input', topic: q.topic || '', q: q.q, answer: q.answer, context: q.context || '', caseTitle: q.caseTitle || '', explain: q.explain || '' }); return; }
      let choices = q.choices.slice(), answer = q.answer;
      if (config.shuffleChoices){
        const order = shuffle(choices.map((_, i) => i));
        choices = order.map(i => q.choices[i]);
        answer = order.indexOf(q.answer);
      }
      questions.push({ id: q.id, level: L, type: 'choice', topic: q.topic || '', q: q.q, choices, answer, explain: q.explain || '' });
    });
  });
  return { questions, shortages };
}

function startExam(applicant){
  const { questions } = buildExam(getBank());
  const now = Date.now();
  session = {
    id: uid(), applicant, startedAt: now,
    deadline: config.timeLimitMin > 0 ? now + config.timeLimitMin * 60000 : null,
    questions, answers: questions.map(() => null), current: 0, submitted: false, result: null
  };
  saveSession();
  route();
}

function grade(s, auto){
  const byLevel = {}; LEVELS.forEach(L => byLevel[L] = { correct: 0, total: 0 });
  const answers = s.questions.map((q, i) => {
    const picked = s.answers[i]; const correct = q.type === 'input' ? inputCorrect(q, picked) : picked === q.answer;
    byLevel[q.level].total++; if (correct) byLevel[q.level].correct++;
    return { id: q.id, level: q.level, text: q.q.slice(0, 80), picked, answer: q.answer, correct, answered: isAnswered(picked) };
  });
  const total = answers.length, score = answers.filter(a => a.correct).length;
  const percent = total ? Math.round(score / total * 100) : 0;
  const now = Date.now();
  return {
    id: s.id, name: s.applicant.name, phone: s.applicant.phone, email: s.applicant.email,
    startedAt: s.startedAt, submittedAt: now, durationSec: Math.round((now - s.startedAt) / 1000),
    score, total, percent, pass: percent >= config.passPercent, passPercent: config.passPercent,
    byLevel, answers, auto: !!auto, sent: config.webhookUrl ? 'pending' : 'none'
  };
}

function submitExam(auto){
  if (!session || session.submitted) return;
  if (!auto){
    const un = session.answers.filter(a => !isAnswered(a)).length;
    const msg = un ? `아직 답하지 않은 문항이 ${un}개 있습니다.\n그래도 제출할까요?` : '답안을 제출할까요? 제출 후에는 수정할 수 없습니다.';
    if (!confirm(msg)) return;
  }
  stopTimer();
  const result = grade(session, auto);
  const an = analyzeResult(session, result);
  result.weak = an.weak.map(p => `PART ${p.no} (${p.correct}/${p.total})`).join(', ');
  result.topicStats = an.topics.map(t => `${t.topic} ${t.correct}/${t.total}`).join(', ');
  session.submitted = true; session.result = result; saveSession();
  const list = store.get('exam.results', []); list.push(result); store.set('exam.results', list);
  postWebhook(result).then(status => {
    const l = store.get('exam.results', []); const r = l.find(x => x.id === result.id); if (r){ r.sent = status; store.set('exam.results', l); }
  });
  route();
}

async function postWebhook(rec){
  if (!config.webhookUrl) return 'none';
  try{
    await fetch(config.webhookUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(rec) });
    return 'ok';
  }catch(e){ return 'fail'; }
}

// ===================== 타이머 =====================
function startTimer(){ stopTimer(); tick(); timerId = setInterval(tick, 500); }
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }
function tick(){
  if (!session || session.submitted) return;
  const el = document.getElementById('timer'); const now = Date.now();
  if (session.deadline){
    const rem = (session.deadline - now) / 1000;
    if (el){ el.textContent = fmtTime(rem); el.classList.toggle('warn', rem < 60); }
    if (rem <= 0){ submitExam(true); toast('제한 시간이 끝나 자동으로 제출되었습니다.'); }
  } else if (el){ el.textContent = fmtTime((now - session.startedAt) / 1000); }
}

window.addEventListener('beforeunload', e => {
  if (session && !session.submitted && location.hash !== '#admin'){ e.preventDefault(); e.returnValue = ''; }
});

// ===================== 라우팅 =====================
function route(){
  stopTimer(); document.onkeydown = null;
  if (location.hash === '#admin') return renderAdmin();
  if (session && !session.submitted) return renderExam();
  if (session && session.submitted) return renderResult();
  renderEntry();
}
window.addEventListener('hashchange', route);

      <div class="who">${esc(s.applicant.name)}<small>${esc(config.title)}</small></div>
      <div class="prog">${answered} / ${n} 응답</div>
      <div class="timer" id="timer" aria-live="off">${s.deadline ? fmtTime((s.deadline - Date.now())/1000) : '00:00'}</div>
      <button class="btn sm" id="submit-top" type="button">제출</button>
    </div>
    <div class="progressbar"><i style="width:${answered / n * 100}%"></i></div>
  </div>
  <div class="shell">
    <nav class="qnav" aria-label="문항 이동">${navHtml}</nav>
    <article class="question">
      <div class="head"><span class="lvl">레벨 ${q.level}</span><span class="num">문항 ${i+1} / ${n}</span>${isInput ? '<span class="chip">계산형</span>' : ''}</div>
      ${bodyHtml}
      <div class="pager">
        <button class="btn" type="button" id="prev" ${i === 0 ? 'disabled' : ''}>이전</button>
        ${i < n - 1 ? `<button class="btn primary" type="button" id="next">다음</button>` : `<button class="btn primary" type="button" id="submit">답안 제출</button>`}
      </div>
    </article>
    <p class="keyhint">${isInput ? '입력 후 <kbd>다음</kbd> 버튼으로 이동하세요. 답은 자동으로 저장됩니다.' : `숫자 키 <kbd>1</kbd>~<kbd>${q.choices.length}</kbd>로 선택, <kbd>←</kbd> <kbd>→</kbd>로 이동할 수 있습니다.`}</p>
  </div>`;

  app.querySelectorAll('input[name="a"]').forEach(r => r.addEventListener('change', () => pick(+r.value)));
  app.querySelectorAll('.pinput').forEach(inp => inp.addEventListener('input', () => { setPart(+inp.dataset.part, inp.value); }));
  app.querySelectorAll('.pill input').forEach(r => r.addEventListener('change', () => { setPart(+r.name.slice(1), r.value); renderExam(); }));
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(+b.dataset.go)));
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  if (prev) prev.addEventListener('click', () => go(i - 1));
  if (next) next.addEventListener('click', () => go(i + 1));
  ['submit', 'submit-top'].forEach(id => { const b = document.getElementById(id); if (b) b.addEventListener('click', () => submitExam(false)); });
  document.onkeydown = e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.type !== 'radio') return;
    if (isInput) return;
    if (/^[1-9]$/.test(e.key) && +e.key <= q.choices.length){ pick(+e.key - 1); }
    else if (e.key === 'ArrowRight' && i < n - 1) go(i + 1);
    else if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
  };
  startTimer();

  function pick(ci){ s.answers[i] = ci; saveSession(); renderExam(); }
  function setPart(pi, val){
    if (!Array.isArray(s.answers[i])) s.answers[i] = [];
    s.answers[i][pi] = val; saveSession();
    // 입력 중에는 전체를 다시 그리지 않고 진행 표시만 갱신
    const done = s.answers.filter(isAnswered).length;
    const prog = app.querySelector('.prog'); if (prog) prog.textContent = `${done} / ${n} 응답`;
    const bar = app.querySelector('.progressbar i'); if (bar) bar.style.width = (done / n * 100) + '%';
    const nb = app.querySelector(`[data-go="${i}"]`); if (nb) nb.classList.toggle('done', isAnswered(s.answers[i]));
  }
  function go(k){ if (k < 0 || k >= n) return; s.current = k; saveSession(); renderExam(); window.scrollTo({ top: 0 }); }
}

async function importGuide(f){
  if (!window.mammoth){ toast('Word 읽기 도구를 불러오지 못했습니다(인터넷 연결 필요).'); return; }
  try{
    const { value: html } = await mammoth.convertToHtml({ arrayBuffer: await f.arrayBuffer() });
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const old = getGuide() || {};
    const guide = { title: '', motto: old.motto || '', parts: [], topicMap: old.topicMap || {}, keywordMap: old.keywordMap || [] };
    let part = null, sec = null;
    const push = (kind, text) => { text = text.replace(/\s+/g, ' ').trim(); if (!text || !part) return; if (!sec){ sec = { title: '', level: 2, blocks: [] }; part.sections.push(sec); } sec.blocks.push({ kind, text }); };
    [...doc.body.children].forEach(el => {
      const tag = el.tagName.toLowerCase(); const text = el.textContent.replace(/\s+/g, ' ').trim(); if (!text) return;
      if (tag === 'h1'){ const pm = text.match(/PART\s*(\d+)/i); if (!guide.title && !pm && !part){ guide.title = text; return; } part = { no: pm ? +pm[1] : null, title: text, sections: [] }; guide.parts.push(part); sec = null; }
      else if (tag === 'h2' || tag === 'h3'){ if (/^목차$/.test(text)) return; if (!part){ part = { no: null, title: text, sections: [] }; guide.parts.push(part); } sec = { title: text, level: tag === 'h2' ? 2 : 3, blocks: [] }; part.sections.push(sec); }
      else if (tag === 'ul' || tag === 'ol'){ [...el.querySelectorAll('li')].forEach(li => push('bullet', li.textContent)); }
      else if (tag === 'blockquote'){ push('quote', text); }
      else { if (!part) return; const formula = text.length < 70 && /[=×÷→]/.test(text); push(formula ? 'formula' : 'p', text); }
    });
    if (!guide.title) guide.title = f.name.replace(/\.docx$/i, '');
    if (!guide.parts.length) return toast('PART(제목 1)를 찾지 못했습니다. Word에서 제목 스타일을 확인해 주세요.');
    store.set('exam.guideDraft', guide); toast(`교안을 읽었습니다: PART ${guide.parts.filter(p => p.no != null).length}개`); renderGuideTab();
  }catch(e){ toast('교안을 읽지 못했습니다: ' + e.message); }
}

function reindex(list){
  const c = {}; LEVELS.forEach(L => c[L] = 0);
  return list.slice().sort((a, b) => a.level - b.level).map(q => { c[q.level]++; return Object.assign({}, q, { id: `L${q.level}-${String(c[q.level]).padStart(3, '0')}` }); });
}
function saveDraft(list){ store.set('exam.bankDraft', reindex(list)); }

function parseCSV(text){
  const rows = []; let row = [], field = '', inQ = false; text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQ){ if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else inQ = false; } else field += c; }
    else if (c === '"') inQ = true;
    else if (c === ','){ row.push(field); field = ''; }
    else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function rowsToQuestions(rows){
  const questions = [], errors = [];
  rows.forEach((r, idx) => {
    const cells = r.map(v => String(v == null ? '' : v).trim());
    if (cells.every(v => !v)) return;
    const level = parseInt(cells[0], 10);
    if (idx === 0 && !(level >= 1 && level <= 5)) return; // 헤더 행
    const line = idx + 1;
    if (!(level >= 1 && level <= 5)) return errors.push(`${line}행: 레벨은 1~5여야 합니다. ("${cells[0]}")`);
    const q = cells[1]; if (!q) return errors.push(`${line}행: 문제가 비어 있습니다.`);
    const rawChoices = cells.slice(2, 7); const keep = rawChoices.map((c, i) => ({ c, i })).filter(x => x.c);
    if (keep.length === 0 && cells[7] && !/^\d$/.test(cells[7])){
      // 보기 없이 정답만 있으면 계산형(주관식)
      if (!parseAnswerKey(cells[7]).length) return errors.push(`${line}행: 계산형 정답을 읽을 수 없습니다. ("${cells[7]}")`);
      questions.push({ id: '', level, type: 'input', q, answer: cells[7], explain: cells[8] || '', topic: cells[9] || '', context: cells[10] || '', caseTitle: cells[11] || '', group: cells[12] || '' }); return;
    }
    if (keep.length < 2) return errors.push(`${line}행: 보기는 최소 2개 필요합니다.`);
    const ansNum = parseInt(String(cells[7]).replace(/[^\d]/g, ''), 10);
    if (!(ansNum >= 1 && ansNum <= 5) || !rawChoices[ansNum - 1]) return errors.push(`${line}행: 정답 번호가 올바르지 않습니다. ("${cells[7]}")`);
    questions.push({ id: '', level, type: 'choice', q, choices: keep.map(x => x.c), answer: keep.findIndex(x => x.i === ansNum - 1), explain: cells[8] || '', topic: cells[9] || '' });
  });
  return { questions, errors };
}
function jsonToQuestions(text){
  let data = JSON.parse(text.replace(/^\s*window\.QUESTION_BANK\s*=\s*/, '').replace(/;\s*$/, ''));
  if (!Array.isArray(data)) throw new Error('배열이 아닙니다');
  return rowsToQuestions(data.map(questionToRow));
}
async function importFile(f){
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  try{
    let parsed;
    if (ext === 'xlsx' || ext === 'xls'){
      if (!window.XLSX){ toast('엑셀 읽기 도구를 불러오지 못했습니다(인터넷 연결 필요). CSV로 저장해 올려주세요.'); return; }
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      parsed = rowsToQuestions(XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }));
    } else if (ext === 'docx'){
      if (!window.mammoth || !window.parseWordText){ toast('Word 읽기 도구를 불러오지 못했습니다(인터넷 연결 필요).'); return; }
      const { value: text } = await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
      const lm = text.match(/LEVEL\s*([1-4])/i) || f.name.match(/LEVEL\s*_?([1-4])/i) || f.name.match(/레벨\s*([1-4])/);
      const wordLevel = lm ? +lm[1] : 1;
      const r = parseWordText(text, wordLevel);
      parsed = { questions: r.questions, errors: r.problems, isWord: true, wordLevel, levelDetected: !!lm };
    } else if (ext === 'json' || ext === 'js'){ parsed = jsonToQuestions(await f.text()); }
    else { parsed = rowsToQuestions(parseCSV(await f.text())); }
    A.pending = Object.assign({ name: f.name }, parsed);
  }catch(e){ toast('파일을 읽지 못했습니다: ' + e.message); }
  renderQuestionsTab();
}
const SHEET_HEADER = ['레벨', '문제', '보기1', '보기2', '보기3', '보기4', '보기5', '정답(번호 또는 계산형 정답)', '해설', '분류', '상황 설명(계산형)', '사례 제목(계산형)', '사례 묶음(계산형)'];
function questionToRow(q){
  const choices = q.type === 'input' ? ['', '', '', '', ''] : (q.choices || []).concat(['', '', '', '', '']).slice(0, 5);
  const answer = q.type === 'input' ? q.answer : (q.answer | 0) + 1;
  return [q.level, q.q, ...choices, answer, q.explain || '', q.topic || '', q.context || '', q.caseTitle || '', q.group || ''];
}
function downloadTemplate(){
  const rows = [SHEET_HEADER,
    [1, '매출을 가장 기본적으로 분해한 식은?', '객수 × 객단가', '신규 × 재방문', '광고비 × 전환율', '노출 × 리뷰', 'LTV × CAC', 1, '', '사업·매출·비용의 기본', '', '', ''],
    [2, '3, 6, 12, 24 다음 수는?', '36', '42', '48', '54', '', 3, '앞의 수에 2를 곱합니다.', '', '', '', ''],
    [5, '현재매출에서 1차 목표매출까지 부족한 매출액을 구하시오.', '', '', '', '', '', '16,000,000원', '5,200만원 - 3,600만원', '1차 목표매출', 'A매장의 현재 월매출은 3,600만원, 1차 목표매출은 5,200만원이다.', 'CASE 1. 1차 목표매출과 신규 확보', 'CASE 1']];
  if (window.XLSX){
    const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = [{ wch: 6 }, { wch: 50 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 24 }, { wch: 30 }, { wch: 20 }, { wch: 50 }, { wch: 28 }, { wch: 10 }];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '문항'); XLSX.writeFile(wb, '문항_양식.xlsx');
  } else download('문항_양식.csv', toCSV(rows), 'text/csv;charset=utf-8');
}
function exportXlsx(bank){
  const rows = [SHEET_HEADER].concat(bank.map(questionToRow));
  if (window.XLSX){ const ws = XLSX.utils.aoa_to_sheet(rows); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '문항'); XLSX.writeFile(wb, '문제은행.xlsx'); }
  else download('문제은행.csv', toCSV(rows), 'text/csv;charset=utf-8');
}
function exportQuestionsJs(bank){
  const text = `// 문제은행 데이터 — 관리자 페이지에서 내려받은 파일입니다. index.html 옆의 questions.js를 이 파일로 교체하세요.\n// 생성: ${fmtDate(Date.now())} · ${bank.length}문항\nwindow.QUESTION_BANK = ${JSON.stringify(reindex(bank), null, 2)};\n`;
  download('questions.js', text, 'text/javascript;charset=utf-8');
  toast('questions.js를 내려받았습니다. 기존 파일을 교체하세요.');
}

// ---------- 응시 결과 ----------
function renderResultsTab(){
  const panel = document.getElementById('panel');
  const list = store.get('exam.results', []).slice().reverse();
  const passN = list.filter(r => r.pass).length;
  const avg = list.length ? Math.round(list.reduce((s, r) => s + r.percent, 0) / list.length) : 0;
  panel.innerHTML = `
    <div class="notice">여기에는 <b>이 브라우저(이 컴퓨터)에서 치른 시험</b>의 결과만 남습니다. 여러 사람이 각자 기기로 응시한 결과를 한곳에 모으려면 설정 탭에서 <b>구글 시트 전송 주소</b>를 등록하세요.</div>
    <div class="stats">
      <div class="stat"><div class="k">응시</div><div class="v">${list.length}<small> 명</small></div></div>
      <div class="stat"><div class="k">합격</div><div class="v">${passN}<small> 명</small></div></div>
      <div class="stat"><div class="k">평균 정답률</div><div class="v">${avg}<small> %</small></div></div>
      <div class="stat"><div class="k">시트 전송 실패</div><div class="v">${list.filter(r => r.sent === 'fail').length}<small> 건</small></div></div>
    </div>
    <div class="toolbar"><span class="sp"></span><button class="btn sm" type="button" id="exp-csv" ${list.length ? '' : 'disabled'}>CSV로 내보내기</button><button class="btn sm danger" type="button" id="clear" ${list.length ? '' : 'disabled'}>전체 삭제</button></div>
    <div class="tablewrap"><table>
      <thead><tr><th>제출 일시</th><th>이름</th><th>전화번호</th><th>이메일</th><th class="num">점수</th>${LEVELS.map(L => `<th class="num">L${L}</th>`).join('')}<th>판정</th><th>복습 파트</th><th class="num">소요</th><th>전송</th></tr></thead>
      <tbody>${list.length ? list.map(r => `
        <tr class="clickable" data-open="${r.id}">
          <td class="mono" style="white-space:nowrap">${fmtDate(r.submittedAt)}</td><td style="white-space:nowrap">${esc(r.name)}</td><td class="mono">${esc(r.phone)}</td><td style="white-space:nowrap">${esc(r.email)}</td>
          <td class="num"><b>${r.score}</b>/${r.total} <span style="color:var(--muted)">(${r.percent}%)</span></td>
          ${LEVELS.map(L => `<td class="num">${r.byLevel[L] ? r.byLevel[L].correct + '/' + r.byLevel[L].total : '-'}</td>`).join('')}
          <td><span class="chip ${r.pass ? 'ok' : 'bad'}">${r.pass ? '합격' : '불합격'}</span>${r.auto ? ' <span class="chip warn" title="시간 종료 자동 제출">자동</span>' : ''}</td>
          <td style="font-size:12px;color:var(--ink-2);min-width:120px">${esc(r.weak || '-')}</td>
          <td class="num mono">${fmtTime(r.durationSec)}</td>
          <td>${({ ok: '<span class="chip ok">전송됨</span>', fail: '<span class="chip bad">실패</span>', pending: '<span class="chip">대기</span>', none: '<span class="chip">-</span>' })[r.sent] || '-'}</td>
        </tr>
        ${A.open === r.id ? `<tr><td colspan="${9 + LEVELS.length}" class="detail">${r.topicStats ? `<div style="margin-bottom:8px;color:var(--ink-2)">분류별: ${esc(r.topicStats)}</div>` : ''}${r.answers.map((a, i) => { const calc = Array.isArray(a.picked) || typeof a.answer === 'string'; const mine = Array.isArray(a.picked) ? a.picked.join(' / ') : a.picked == null ? '' : (a.picked + 1) + '번'; const key = typeof a.answer === 'string' ? a.answer : (a.answer + 1) + '번'; return `<div class="a"><span class="mono">${esc(a.id)}</span><span>${esc(a.text)}</span><span class="chip ${a.correct ? 'ok' : 'bad'}">${a.correct ? '정답' : !isAnswered(a.picked) ? '미응답' : '오답 (' + esc(mine) + ' 입력, 정답 ' + esc(key) + ')'}</span></div>`; }).join('')}</td></tr>` : ''}`).join('')
        : `<tr><td colspan="${9 + LEVELS.length}" style="text-align:center;color:var(--muted);padding:28px">아직 응시 결과가 없습니다.</td></tr>`}</tbody>
    </table></div>`;
  panel.querySelectorAll('[data-open]').forEach(tr => tr.addEventListener('click', () => { A.open = A.open === tr.dataset.open ? null : tr.dataset.open; renderResultsTab(); }));
  document.getElementById('exp-csv').addEventListener('click', () => {
    const rows = [['제출일시', '이름', '전화번호', '이메일', '점수', '총문항', '정답률(%)', '판정', ...LEVELS.map(L => `레벨${L}`), '소요(초)', '자동제출', '복습 파트', '분류별', '문항별']]
      .concat(list.map(r => [fmtDate(r.submittedAt), r.name, r.phone, r.email, r.score, r.total, r.percent, r.pass ? '합격' : '불합격', ...LEVELS.map(L => r.byLevel[L] ? `${r.byLevel[L].correct}/${r.byLevel[L].total}` : ''), r.durationSec, r.auto ? 'Y' : 'N', r.weak || '', r.topicStats || '', r.answers.map(a => `${a.id}:${a.correct ? 'O' : 'X'}`).join(' ')]));
    download(`응시결과_${fmtDate(Date.now()).replace(/[^\d]/g, '').slice(0, 12)}.csv`, toCSV(rows), 'text/csv;charset=utf-8');
  });
  document.getElementById('clear').addEventListener('click', () => { if (confirm('이 브라우저에 저장된 응시 결과를 모두 삭제할까요? 되돌릴 수 없습니다.')){ store.del('exam.results'); renderResultsTab(); } });
}

// ---------- 설정 ----------
function renderSettingsTab(){
  const panel = document.getElementById('panel'); const c = config;
  panel.innerHTML = `
  <form id="cfg" class="card" style="max-width:720px">
    <div class="field"><label>시험 이름</label><input class="input" name="title" value="${esc(c.title)}"></div>
    <div class="field"><label>안내 문구 (시작 화면)</label><textarea class="input" name="intro">${esc(c.intro)}</textarea></div>
    <div class="grid2">
      <div class="field"><label>레벨당 출제 문항 수</label><input class="input" name="perLevel" type="number" min="1" max="100" value="${c.perLevel}"><span class="hint">레벨 수 × 이 값 = 총 문항 수</span></div>
      <div class="field"><label>제한 시간 (분)</label><input class="input" name="timeLimitMin" type="number" min="0" max="600" value="${c.timeLimitMin}"><span class="hint">0이면 제한 없이 경과 시간만 표시</span></div>
      <div class="field"><label>합격 기준 (정답률 %)</label><input class="input" name="passPercent" type="number" min="0" max="100" value="${c.passPercent}"></div>
      <div class="field"><label>계산형 허용 오차 (%)</label><input class="input" name="numTolerancePct" type="number" min="0" max="20" step="0.1" value="${c.numTolerancePct}"><span class="hint">정답과 이 비율 이내의 숫자는 정답 처리 (비율 답은 ±0.01%p, 정수 답은 ±0.5 기본 허용)</span></div>
      <div class="field"><label>관리자 비밀번호</label><input class="input" name="adminPass" value="${esc(c.adminPass)}"><span class="hint">페이지 소스로 볼 수 있는 간단한 잠금입니다. 결과 원본은 구글 시트에 보관하세요.</span></div>
    </div>
    <div style="margin-bottom:14px">
      <label class="switch"><div><div class="l">보기 순서 무작위 섞기</div><div class="d">같은 문항도 응시자마다 보기 순서가 달라집니다.</div></div><input type="checkbox" name="shuffleChoices" ${c.shuffleChoices ? 'checked' : ''}></label>
      <label class="switch"><div><div class="l">제출 후 정답·해설 공개</div><div class="d">끄면 응시자에게는 점수와 레벨별 결과만 보입니다.</div></div><input type="checkbox" name="showAnswers" ${c.showAnswers ? 'checked' : ''}></label>
    </div>
    <div class="field"><label>결과 전송 주소 (구글 Apps Script 웹앱 URL)</label><input class="input" name="webhookUrl" value="${esc(c.webhookUrl)}" placeholder="https://script.google.com/macros/s/…/exec"><span class="hint">비워 두면 결과는 응시한 브라우저에만 저장됩니다. 설정 방법은 README.md 를 참고하세요.</span></div>
    <div class="notice">설정은 이 브라우저에 저장됩니다. 실제 배포에서 모든 응시자에게 적용하려면 index.html 상단의 <b>DEFAULT_CONFIG</b> 값을 같은 내용으로 바꿔 주세요. <button class="btn sm ghost" type="button" id="cfg-copy">설정 JSON 복사</button></div>
    <div class="row end"><button class="btn sm ghost" type="button" id="cfg-reset">기본값으로</button><button class="btn primary" type="submit">저장</button></div>
  </form>`;
  document.getElementById('cfg').addEventListener('submit', e => {
    e.preventDefault(); const f = new FormData(e.target);
    saveConfig({ title: String(f.get('title')).trim() || DEFAULT_CONFIG.title, intro: String(f.get('intro')).trim(), perLevel: Math.max(1, +f.get('perLevel') || 5), timeLimitMin: Math.max(0, +f.get('timeLimitMin') || 0), passPercent: Math.min(100, Math.max(0, +f.get('passPercent') || 0)), numTolerancePct: Math.max(0, +f.get('numTolerancePct') || 0), shuffleChoices: !!f.get('shuffleChoices'), showAnswers: !!f.get('showAnswers'), adminPass: String(f.get('adminPass')) || DEFAULT_CONFIG.adminPass, webhookUrl: String(f.get('webhookUrl')).trim() });
    toast('설정을 저장했습니다.'); renderAdmin();
  });
  document.getElementById('cfg-reset').addEventListener('click', () => { if (confirm('설정을 기본값으로 되돌릴까요?')){ saveConfig({}); renderAdmin(); } });
  document.getElementById('cfg-copy').addEventListener('click', () => { navigator.clipboard.writeText(JSON.stringify(config, null, 2)).then(() => toast('복사했습니다.'), () => toast('복사에 실패했습니다.')); });
}

route();
})();
</script>
